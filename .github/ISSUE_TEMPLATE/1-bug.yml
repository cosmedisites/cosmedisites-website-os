name: "BUG — repeatable failure"
description: A process, prompt or template is producing a repeatable failure.
title: "[BUG] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        **No client or patient data in this issue.** Anonymise every example (see examples/README.md).
        A BUG means the system produces a wrong or unsafe result *repeatably*. A client disliking something is not a BUG.
  - type: input
    id: component
    attributes:
      label: What is failing?
      description: Prompt ID, template, stage card, QA gate or document
      placeholder: "e.g. 4D Migration / Redirect Map"
    validations: {required: true}
  - type: textarea
    id: failure
    attributes:
      label: What happens, and what should happen?
    validations: {required: true}
  - type: textarea
    id: evidence
    attributes:
      label: Anonymised evidence
      description: Paste the relevant (anonymised) output, or describe it. How many projects has this happened on?
    validations: {required: true}
  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options: ["Compliance / regulated-claims risk", "Search / migration risk", "Strategy quality", "Wasted time / rework", "Minor"]
    validations: {required: true}
