name: release

# Push a tag like v1.0 or v1.1 on main to publish a release with the generated
# prompt library and the Chirply stage-config payload attached.
# Upload packaged DOCX/XLSX/ZIP files to the release by hand afterwards.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Verify VERSION matches tag
        run: |
          test "v$(cat VERSION)" = "${GITHUB_REF_NAME}" || { echo "VERSION file ($(cat VERSION)) does not match tag ${GITHUB_REF_NAME}"; exit 1; }
      - run: python3 scripts/safety_scan.py
      - run: python3 scripts/build.py --check
      - name: Package
        run: |
          cp dist/ALL_PROMPTS.md "dist/CosmediSites_ALL_PROMPTS_${GITHUB_REF_NAME}.md"
          git archive --format=zip --prefix="cosmedisites-website-os-${GITHUB_REF_NAME}/" -o "dist/cosmedisites-website-os-${GITHUB_REF_NAME}.zip" HEAD
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "CosmediSites Website OS ${GITHUB_REF_NAME}" \
            --notes "See CHANGELOG.md for this version. Packaged DOCX/XLSX source documents are attached separately." \
            "dist/CosmediSites_ALL_PROMPTS_${GITHUB_REF_NAME}.md" \
            dist/prompt-catalog.json \
            dist/stage-config.json \
            "dist/cosmedisites-website-os-${GITHUB_REF_NAME}.zip"
