# CosmediSites Website OS — stage registry
#
# The single source of stage metadata. `scripts/build.py` uses it to generate:
#   - every workflows/stage-*/README.md (the human-facing "stage card");
#   - dist/stage-config.json (the payload the operational tool, Chirply, uses for
#     stage tasks, Definition-of-Done subtasks and knowledge links).
#
# Provenance (reconciled against Website OS Source Pack v1.0):
#   owner / reviewer / client_involved -> Website Redesign SOP v1.0 (Tracker v1.0 where the SOP is silent)
#   approval                           -> Operational Tracker v1.0, "Approval Required?" column
#   gate                               -> AI Workflow Pack v1.0, Workflow Index "Gate" column
#   objective / route / prompts        -> AI Workflow Pack v1.0
#   output                             -> SOP v1.0
#   dod                                -> SOP v1.0 Definition of Done, verbatim. Where the SOP has no
#                                         checklist (Stages 9, 13, 14), the stage's template DoD, verbatim.
#                                         `dod_source` records which.
#   gate_checks                        -> additional gate conditions stated elsewhere in the source
#                                         material; each one cites its source.
#   playbook                           -> related Playbook sections (editorial cross-reference only)
#
# Change via pull request (methodology class if `dod`, owners or stages change),
# then run: python3 scripts/build.py

repo_url: https://github.com/cosmedisites/cosmedisites-website-os
default_branch: main

stages:
  - id: "00"
    name: Commercial Brief
    slug: stage-00-commercial-brief
    sop_stage: 0
    objective: Convert discovery information into a commercial brief that governs every downstream decision.
    owner: Project Lead / Strategist
    reviewer: Project Lead
    client_involved: "Yes"
    approval: Client factual confirmation
    approval_type: client
    gate: Client factual confirmation
    route: "0A → 0B → 0C; use 0D if blocked"
    prompts:
      - {id: 0A, kind: run}
      - {id: 0B, kind: run}
      - {id: 0C, kind: validate}
      - {id: 0D, kind: client, note: only if OPEN items block strategy}
    output: Project Strategy Brief
    templates: [project-strategy-brief]
    playbook: [1, 2, 15]
    handoffs: [H01]
    client_comms: [C01, C02]
    dod_source: SOP
    dod:
      - Business objective is explicit.
      - Growth model and priority services are understood.
      - Audience and buying anxieties are documented.
      - Website role in acquisition is clear.
      - Known SEO/compliance constraints are captured.
      - Client confirms the factual brief.
      - "**Creative Intensity rated** (Conservative / Elevated / High-expression), scored on: audience visual sophistication; competitive visual bar; brand asset strength; purchase psychology (emotion, identity, status); commercial value (LTV, premium pricing); compliance risk (may constrain individual elements, never an automatic reason for a dull site). Scores recorded in the brief."
      - "**Strategic invariants captured as a short LOCKED list**: positioning, entities, service architecture, search intent, CRO paths, proof requirements, mobile CTA, compliance limits. Later creativity cannot damage these."
    gate_checks:
      - {check: "The team can answer: What does this business need the new website to achieve? What would make the redesign commercially unsuccessful even if it looked excellent?", source: "SOP Stage 0"}
      - {check: "0C validator returns PASS", source: "Workflow Index step 7"}
      - {check: "Master Project Context created in the project Drive folder", source: "AI Workflow Pack README (Recommended workspace)"}

  - id: "01"
    name: Evidence
    slug: stage-01-evidence
    sop_stage: 1
    objective: Build a factual picture of the current site, competitors and available performance evidence before prescribing solutions.
    owner: Strategist
    reviewer: Project Lead
    client_involved: "No"
    approval: "No"
    approval_type: internal
    gate: Internal
    route: "1A + 1B → 1C → 1D"
    prompts:
      - {id: 1A, kind: run}
      - {id: 1B, kind: run}
      - {id: 1C, kind: run}
      - {id: 1D, kind: validate}
    output: Evidence Pack
    templates: [evidence-pack]
    playbook: [3]
    dod_source: SOP
    dod:
      - Website reviewed.
      - Mobile reviewed.
      - Competitors reviewed.
      - Existing assets classified.
      - Revenue-driving services identified.
      - Growth priorities identified.
      - Proof inventory started.
      - Key unknowns identified.
      - Strategic diagnosis drafted.
      - "Brand evidence gathered beyond the website: the client's Instagram/TikTok, premises photos, team, uniforms, signage and existing photography/video inventoried for Stage 05."
    gate_checks:
      - {check: "Diagnostic sentence written: “The existing site currently communicates X. The business needs to become Y. The primary barriers are A, B and C.”", source: "SOP Stage 1"}
      - {check: "1D validator returns PASS", source: "Workflow Index step 7"}

  - id: "02"
    name: Strategic Diagnosis
    slug: stage-02-diagnosis
    sop_stage: 2
    objective: Turn evidence into a prioritised explanation of what is suppressing the business outcome, without jumping prematurely to visual solutions.
    owner: Strategist
    reviewer: Project Lead
    client_involved: "No"
    approval: "No"
    approval_type: internal
    gate: Internal
    route: "2A → 2B → 2C"
    prompts:
      - {id: 2A, kind: run}
      - {id: 2B, kind: run}
      - {id: 2C, kind: validate}
    output: Strategic Diagnosis
    templates: [strategic-diagnosis]
    playbook: [2]
    dod_source: SOP
    dod:
      - Diagnosis can be understood without discussing colours/fonts.
      - Commercial, trust, UX and scalability issues are separated.
      - Top three opportunities are prioritised.
      - Every major conclusion traces back to evidence.
    gate_checks:
      - {check: "2C red team returns PASS", source: "Workflow Index step 7"}

  - id: "03"
    name: Positioning
    slug: stage-03-positioning
    sop_stage: 3
    objective: Define the market perception, brand architecture and strategic ideas the new website must make obvious.
    owner: Strategist
    reviewer: Creative / Project Lead
    client_involved: Strategic approval
    approval: "Yes"
    approval_type: client
    gate: Client strategic approval
    locks: Positioning
    route: "3A → 3B + 3C → 3D → 3E"
    prompts:
      - {id: 3A, kind: run}
      - {id: 3B, kind: run}
      - {id: 3C, kind: run}
      - {id: 3D, kind: validate}
      - {id: 3E, kind: client}
    output: Positioning Thesis
    templates: [positioning-thesis]
    playbook: [4, 11]
    handoffs: [H02, H03]
    dod_source: SOP
    dod:
      - Desired perception written.
      - Wrong perception written.
      - Positioning thesis agreed internally.
      - Priority services/categories identified.
      - Clinic/practitioner relationship defined.
      - Future growth test passed.
    gate_checks:
      - {check: "No visual design begins until this is internally approved.", source: "SOP Stage 3"}
      - {check: "3D validator returns PASS", source: "Workflow Index step 7"}
      - {check: "Client strategic approval recorded in the Approval Record", source: "SOP Stage 3 / Tracker"}
      - {check: "Approved positioning added to LOCKED DECISIONS in the Master Project Context", source: "Deployment Guide (Version control)"}

  - id: "04"
    name: IA + SEO
    slug: stage-04-ia-seo
    sop_stage: 4
    objective: Protect valuable search equity while structuring the site around patient intent, commercial priorities and future growth.
    owner: Strategist + SEO Lead
    reviewer: Project Lead
    client_involved: Yes if structure changes
    approval: Conditional (required where service presentation materially changes)
    approval_type: conditional
    gate: Conditional client approval
    route: "4A → 4B + 4C → 4D → 4E"
    prompts:
      - {id: 4A, kind: run}
      - {id: 4B, kind: run}
      - {id: 4C, kind: run}
      - {id: 4D, kind: run}
      - {id: 4E, kind: validate}
    output: Approved Sitemap + SEO Architecture Map
    templates: [sitemap-seo-architecture]
    playbook: [21, 8]
    handoffs: [H04]
    dod_source: SOP
    dod:
      - Every primary page has a purpose.
      - Every primary page has a user/search intent.
      - Existing high-value URLs have a retain/merge/redirect decision.
      - Navigation model is defined.
      - Internal linking is defined.
      - Location/practitioner architecture is explicit.
      - Redirect requirements are known before build.
    gate_checks:
      - {check: "4E validator returns PASS", source: "Workflow Index step 7"}

  - id: "05"
    name: Brand + Visual Direction
    slug: stage-05-visual-direction
    sop_stage: 5
    objective: "Establish the brand's real visual identity and a creative thesis tied to positioning: brand DNA, category benchmark, creative intensity and the assets the direction needs."
    next: {label: "Stage 05T — Creative Translation", path: "../stage-05t-creative-translation/README.md"}
    owner: Designer
    reviewer: Strategist / Creative Lead
    client_involved: Approval
    approval: "Yes"
    approval_type: client
    gate: Client approval at Stage 05V
    route: "5A → 5B + 5C → 5D"
    prompts:
      - {id: 5A, kind: run}
      - {id: 5B, kind: run}
      - {id: 5C, kind: run}
      - {id: 5D, kind: validate}
    output: Visual Direction / Style System
    templates: [visual-direction, current-proposed-summary]
    playbook: [5, 7]
    dod_source: SOP
    dod:
      - Every major visual choice has a strategic rationale.
      - System supports desktop and mobile.
      - Photography direction is defined.
      - CTA hierarchy is unambiguous.
      - Client-facing explanation avoids internal design jargon.
      - "**Category visual benchmark**: MATCH / BEAT / AVOID board from 5 to 10 direct competitors, strong adjacent brands and the client's own social and physical brand. Not \"sites we like\": record visual patterns, category clichés and the current creative ceiling. For visual categories, Instagram, TikTok, clinic interiors, practitioner personal brands and adjacent beauty/fashion/hospitality brands are mandatory sources."
      - "**Brand reality audit**: \"What does this brand look like when it isn't a website?\" Brand DNA recorded: colours, contrast, image style, motion, typography, personality, distinctive physical assets."
      - "**Asset reality check**: USE / SHOOT / SOURCE / DO NOT FAKE matrix, and the client shoot request sent."
      - "**Creative thesis**: one line (HAUS: \"fashion-forward aesthetics house with clinical credibility\", not \"premium editorial clinic\"), with 3 to 5 principles and explicit anti-goals."
    gate_checks:
      - {check: "5D validator returns PASS", source: "Workflow Index step 7"}
      - {check: "Client approval of the direction is recorded at Stage 05V, on the keyframes, not on mood boards", source: "Website OS v1.1"}

  - id: "06"
    name: Page + Component System (from approved keyframes)
    slug: stage-06-page-system
    sop_stage: 6
    objective: Reverse-engineer the approved Stage 05T keyframes into reusable Elementor globals, Atomic components, page patterns, responsive behaviour and content rules. The component library is derived from the creative, not the creative from the component library.
    owner: Designer / UX Lead
    reviewer: Strategist
    client_involved: "No"
    approval: Internal
    approval_type: internal
    gate: Internal / included in review
    route: "6A + 6B + 6C + 6D → 6E"
    prompts:
      - {id: 6A, kind: run}
      - {id: 6B, kind: run}
      - {id: 6C, kind: run}
      - {id: 6D, kind: run}
      - {id: 6E, kind: validate}
    output: Page System + Component Library
    templates: [page-component-system]
    playbook: [10, 9, 14]
    dod_source: SOP
    dod:
      - Required page types have a template.
      - Core components are reusable.
      - Responsive behaviour is defined.
      - New treatments/practitioners/locations can be added without redesigning the system.
      - "**The component system reproduces the approved creative keyframes without materially flattening their visual character** (side-by-side check against 05T)."
      - Do not start until Stage 05V, including the asset gate, has passed.
    gate_checks:
      - {check: "6E scalability validator shows no routine growth scenario requiring an architecture change", source: "Workflow Index step 7 / prompt 6E"}

  - id: "07"
    name: Proof + Content + Photography
    slug: stage-07-proof-content-photography
    sop_stage: 7
    objective: Build the evidence, content and image inputs needed to make the strategy believable without fabricating authority.
    owner: Content Lead
    reviewer: Strategist / Compliance Reviewer
    client_involved: Client supplies inputs
    approval: "No"
    approval_type: client-inputs
    gate: Client supplies inputs
    route: "7A + 7B + 7C → 7D + 7E"
    prompts:
      - {id: 7A, kind: run}
      - {id: 7B, kind: run}
      - {id: 7C, kind: run}
      - {id: 7D, kind: validate}
      - {id: 7E, kind: client}
    output: Proof Inventory + Content/Input Tracker + Photography Brief
    templates: [proof-inventory, content-input-tracker, photography-brief]
    tracker_tabs: [Proof Inventory, Content Inputs]
    playbook: [12, 13]
    handoffs: [H06]
    client_comms: [C05]
    dod_source: SOP
    dod:
      - Proof gaps are known.
      - Each missing input has an owner.
      - Photography requirements are defined.
      - Patient/model consent requirements are identified.
      - Design does not depend on evidence nobody can supply.
      - The shoot brief derives from the Stage 05 asset matrix; every SHOOT item has a date and owner; nothing marked DO NOT FAKE is substituted.
    gate_checks:
      - {check: "7D claims validator shows no UNSUPPORTED claim left in client copy", source: "Workflow Index step 7 / prompt 7D"}

  - id: "08"
    name: Client Strategy Review
    slug: stage-08-client-review
    sop_stage: 8
    objective: Turn the approved internal strategy into a concise client presentation that earns decisions rather than vague feedback.
    owner: Project Lead
    reviewer: Strategist / Designer
    client_involved: "Yes"
    approval: Review meeting
    approval_type: client-meeting
    gate: Review meeting
    route: "8A → 8B → 8C → 8D"
    prompts:
      - {id: 8A, kind: run}
      - {id: 8B, kind: run}
      - {id: 8C, kind: run}
      - {id: 8D, kind: validate}
    output: Client Strategy Deck
    templates: [client-strategy-deck]
    playbook: [16, 23]
    client_comms: [C03]
    dod_source: SOP
    dod:
      - Deck tells a strategic story.
      - Commercial outcome is explicit.
      - Client approval items are explicit.
      - Inputs/next steps are separated from approvals.
    gate_checks:
      - {check: "Internal quality test passed: someone who did not work on the design can answer the 60-second questions", source: "Playbook §23"}
      - {check: "8D red team returns PASS", source: "Workflow Index step 7"}

  - id: "09"
    name: Approval Gate
    slug: stage-09-approval
    sop_stage: 9
    objective: Convert client feedback into explicit decisions, controlled revisions and locked strategic choices.
    owner: Project Lead
    reviewer: "—"
    client_involved: "Yes"
    approval: "Yes"
    approval_type: client
    gate: Client sign-off
    locks: Approved strategic decisions
    route: "9A + 9B → 9C + 9D; use 9E for reopened decisions"
    prompts:
      - {id: 9A, kind: run}
      - {id: 9B, kind: run}
      - {id: 9C, kind: run}
      - {id: 9D, kind: client}
      - {id: 9E, kind: validate, note: only when an approved decision is challenged}
    output: Approval Record
    templates: [approval-record]
    tracker_tabs: [Approvals]
    playbook: [17, 18, 19]
    handoffs: [H08]
    client_comms: [C04, C06]
    dod_source: Template 12 (the SOP has no checklist for Stage 9)
    dod:
      - Every strategic decision has a status.
      - Feedback is classified before action.
      - Locked decisions are identified.
      - Client has a clear record of what happens next.
    gate_checks:
      - {check: "Explicit decisions recorded for positioning, visual direction, navigation/user journey, service hierarchy, practitioner hierarchy, homepage structure and photography direction", source: "SOP Stage 9"}
      - {check: "Nothing enters full build until required strategic decisions are approved.", source: "SOP Stage 9"}
      - {check: "Approved decisions added to LOCKED DECISIONS in the Master Project Context", source: "SOP Revision Control / Deployment Guide"}

  - id: "10"
    name: Production Inputs
    slug: stage-10-production-inputs
    sop_stage: 10
    objective: Get every approved content, evidence and technical input into a verified state before full production/build depends on it.
    owner: Project Lead / Content Lead
    reviewer: Project Lead
    client_involved: "Yes"
    approval: "No"
    approval_type: internal
    gate: Internal gate
    route: "10A → 10B/10C → 10D"
    prompts:
      - {id: 10A, kind: run}
      - {id: 10B, kind: client}
      - {id: 10C, kind: run}
      - {id: 10D, kind: validate}
    output: Content & Input Tracker
    templates: [content-input-tracker]
    tracker_tabs: [Content Inputs]
    dod_source: SOP
    dod:
      - Every required input has an owner.
      - Every input has a status.
      - Pending items have a deadline.
      - Received information is verified before publication.
    gate_checks:
      - {check: "10D Build Readiness Gate returns PASS", source: "Workflow Index step 7"}

  - id: "11"
    name: Build
    slug: stage-11-build
    sop_stage: 11
    objective: Translate approved strategy, design, content and SEO requirements into an implementation package with minimal ambiguity.
    owner: Developer
    reviewer: Designer
    client_involved: "No"
    approval: "No"
    approval_type: internal
    gate: Internal
    route: "11A + 11B + 11C → 11D"
    prompts:
      - {id: 11A, kind: run}
      - {id: 11B, kind: run}
      - {id: 11C, kind: run}
      - {id: 11D, kind: validate}
    output: Implemented build
    templates: [build-handoff]
    playbook: [22]
    handoffs: [H05]
    dod_source: SOP
    dod:
      - Developer is implementing approved decisions.
      - Material UX decisions are not being invented during development.
      - Desktop/mobile states are implemented.
      - SEO/migration requirements are implemented.
      - Tracking requirements are implemented.
      - "**Native implementation pilot first**: hero plus 2 to 3 core sections built in Elementor and checked for motion, imagery, responsive behaviour, Core Web Vitals, editability and visual impact at desktop and mobile. Pilot approved before rolling through the remaining pages."
      - "Roll-out scales without flattening: commodity pages templated, high-value pages keep bespoke moments."
    gate_checks:
      - {check: "11D shows no outstanding CRITICAL variance", source: "Workflow Index step 7 / prompt 11D"}

  - id: "12"
    name: QA
    slug: stage-12-qa
    sop_stage: 12
    objective: Run separate regulated-content, strategy/UX, technical/SEO and creative sign-offs so one type of QA cannot hide another.
    owner: Named QA owners (see gates)
    reviewer: Independent reviewers
    client_involved: "No"
    approval: Internal sign-off
    approval_type: internal
    gate: Internal sign-off
    route: "12A + 12B + 12C + 12F → 12D → 12E"
    prompts:
      - {id: 12A, kind: run, note: Compliance gate}
      - {id: 12B, kind: run, note: Strategy / UX gate}
      - {id: 12C, kind: run, note: Technical / SEO gate}
      - {id: 12D, kind: validate}
      - {id: 12E, kind: validate, note: only if launching with open P0/P1 items}
    output: Compliance + Strategy + Technical + Creative QA sign-off
    templates: [compliance-launch-qa]
    tracker_tabs: [QA]
    qa_gates: [compliance, strategy-ux, technical-seo, creative]
    playbook: [20, 23]
    handoffs: [H07]
    client_comms: [C07]
    dod_source: SOP
    dod:
      - Compliance gate signed off.
      - Strategy/UX gate signed off.
      - Technical/SEO gate signed off.
      - Creative gate (12F) signed off.
      - Blocking issues resolved or explicitly accepted.
    gate_checks:
      - {check: "12D consolidated triage complete; any open P0 has a 12E GO / CONDITIONAL GO decision recorded with owner and rollback trigger", source: "Workflow Index step 7 / prompts 12D–12E"}

  - id: "13"
    name: Launch
    slug: stage-13-launch
    sop_stage: 13
    objective: Launch in a controlled way, verify acquisition/measurement systems and capture the baseline required for post-launch learning.
    owner: "Project Lead (technical owner: Developer)"
    reviewer: Developer / SEO
    client_involved: Client informed
    approval: Launch sign-off
    approval_type: launch
    gate: Launch sign-off
    route: "13A → 13B → 13C + 13D; 13E as needed"
    prompts:
      - {id: 13A, kind: run}
      - {id: 13B, kind: run}
      - {id: 13C, kind: client}
      - {id: 13D, kind: run}
      - {id: 13E, kind: run, note: first 7 days}
    no_validator_reason: The AI Workflow Pack has no Stage 13 validator. The 13B runbook's PASS/FAIL fields are the check.
    output: Launch Record + Measurement Baseline
    templates: [measurement-baseline]
    tracker_tabs: [Measurement]
    playbook: [15]
    client_comms: [C08]
    dod_source: Template 16 (the SOP has no checklist for Stage 13)
    dod:
      - Launch date and comparison period are recorded.
      - Commercial conversion baseline exists where tracking permits.
      - Priority search and landing-page baseline exists.
      - Known tracking limitations are documented.
    gate_checks:
      - {check: "Launch only after QA sign-off.", source: "SOP Stage 13"}
      - {check: "Launch completed; tracking verified; baseline captured.", source: "Tracker (Stage Tracker)"}

  - id: "14"
    name: 30 / 60 / 90 Measurement
    slug: stage-14-measurement
    sop_stage: 14
    objective: Use live behaviour and commercial/search data to decide what to keep, improve, test or scale after launch.
    owner: Strategist / Project Lead
    reviewer: Project Lead
    client_involved: Review as needed
    approval: "No"
    approval_type: internal
    gate: Internal / client review
    route: "14A → 14B → 14C → 14D → 14E"
    prompts:
      - {id: 14A, kind: run, note: day 30}
      - {id: 14B, kind: run, note: day 60}
      - {id: 14C, kind: run, note: day 90}
      - {id: 14D, kind: run}
      - {id: 14E, kind: run}
    no_validator_reason: The AI Workflow Pack has no Stage 14 validator. The 14D decisions are reviewed by the Project Lead.
    output: 90-Day Redesign Performance Review
    templates: [30-60-90-review]
    tracker_tabs: [Measurement]
    playbook: [24, 15]
    client_comms: [C09]
    dod_source: Template 17 (the SOP has no checklist for Stage 14)
    dod:
      - 30/60/90 reviews use the launch baseline.
      - Actions are prioritised by commercial impact.
      - At least one KEEP / IMPROVE / TEST / SCALE decision is recorded.
      - Reusable learning is fed back into the playbook.
    gate_checks:
      - {check: "Reusable learning logged as GitHub Issues (IMPROVEMENT / TEST)", source: "SOP Stage 14 (\"Feed reusable learning back into the operating system\")"}

# v1.1 stages that sit between numbered stages. Their cards are hand-written (not generated);
# this list drives the README stage table only. Stage numbers 06 to 14 are unchanged.
interstitial_stages:
  - {id: 05T, after: "05", name: Creative Translation, slug: stage-05t-creative-translation, owner: Designer / Creative Lead, output: High-fidelity keyframes + Brand Swap Test note, approval: Internal}
  - {id: 05V, after: "05", name: Creative Validation, slug: stage-05v-creative-validation, owner: Strategist + SEO Lead, output: Collision test + asset gate + client-approved keyframes, approval: "Yes"}

# Templates: number from the Template Pack v1.0. `source` = filename in the Source Pack.
templates:
  project-strategy-brief:   {number: "01", title: Project Strategy Brief, source: 01_Project_Strategy_Brief.md}
  evidence-pack:            {number: "02", title: Evidence Pack, source: 02_Evidence_Pack.md}
  strategic-diagnosis:      {number: "03", title: Strategic Diagnosis, source: 03_Strategic_Diagnosis.md}
  positioning-thesis:       {number: "04", title: Positioning Thesis, source: 04_Positioning_Thesis.md}
  current-proposed-summary: {number: "05", title: Current → Proposed Summary, source: 05_Current_Proposed_Summary.md}
  sitemap-seo-architecture: {number: "06", title: Sitemap + SEO Architecture, source: 06_Sitemap_SEO_Architecture.md}
  visual-direction:         {number: "07", title: Visual Direction, source: 07_Visual_Direction.md}
  page-component-system:    {number: "08", title: Page + Component System, source: 08_Page_Component_System.md}
  proof-inventory:          {number: "09", title: Proof Inventory, source: 09_Proof_Inventory.md}
  photography-brief:        {number: "10", title: Photography Brief, source: 10_Photography_Brief.md}
  client-strategy-deck:     {number: "11", title: Client Strategy Deck, source: 11_Client_Strategy_Deck.md}
  approval-record:          {number: "12", title: Approval Record, source: 12_Approval_Record.md}
  content-input-tracker:    {number: "13", title: Content / Input Tracker, source: 13_Content_Input_Tracker.md}
  build-handoff:            {number: "14", title: Build Handoff, source: 14_Build_Handoff.md}
  compliance-launch-qa:     {number: "15", title: Compliance + Launch QA, source: 15_Compliance_Launch_QA.md}
  measurement-baseline:     {number: "16", title: Post-Launch Measurement Baseline, source: 16_Post_Launch_Measurement_Baseline.md}
  30-60-90-review:          {number: "17", title: 30 / 60 / 90 Day Review, source: 17_30_60_90_Day_Review.md}

# QA gates: owners from SOP Stage 12.
qa_gates:
